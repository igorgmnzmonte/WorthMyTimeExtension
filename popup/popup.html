<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
    <title>WorthMyTime</title>
</head>
<body>
    <h2>WorthMyTime</h2>
    
    <div class="row">
        <div class="col" style="flex: 1;">
            <label>Moeda</label>
            <select id="currency">
                <option value="R$">BRL</option>
                <option value="$">USD</option>
                <option value="€">EUR</option>
            </select>
        </div>
        <div class="col" style="flex: 1.5;">
            <label>Exibir nas lojas em</label>
            <select id="timeFormat">
                <option value="auto">Auto</option>
                <option value="minutes">Minutos</option>
                <option value="hours">Horas</option>
                <option value="days">Dias</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div class="col" style="flex: 1.5;">
            <label id="labelSalary">Meus Ganhos (R$)</label>
            <input type="number" id="salary" placeholder="Ex: 3500">
        </div>
        <div class="col" style="flex: 1;">
            <label>Período</label>
            <select id="salaryType">
                <option value="monthly">Por Mês</option>
                <option value="daily">Por Dia</option>
                <option value="hourly">Por Hora</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div class="col" style="flex: 1.5;">
            <label>Escala</label>
            <select id="workScale">
                <option value="5x2">5x2</option>
                <option value="6x1">6x1</option>
                <option value="12x36">12x36</option>
                <option value="custom">Outra</option>
            </select>
        </div>
        <div class="col" style="flex: 1;">
            <label id="labelTimeInput">Hrs/dia</label>
            <input type="number" id="timeInput" placeholder="8" value="8">
        </div>
    </div>

    <div class="input-group">
        <label id="labelPrice">Teste um Preço (R$)</label>
        <input type="number" id="productPrice" placeholder="Ex: 1200">
    </div>

    <div id="resultArea" class="result">
        <div id="timeText"></div>
        <span class="sub-text" id="days-info">do seu tempo</span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
