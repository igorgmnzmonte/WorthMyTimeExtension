<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 300px; font-family: sans-serif; padding: 15px; background: #0f172a; color: white; }
        input { width: 100%; padding: 8px; margin: 5px 0 15px; border-radius: 4px; border: 1px solid #334155; background: #1e293b; color: white; box-sizing: border-box; }
        .result { background: #6366f1; padding: 10px; border-radius: 8px; text-align: center; display: none; }
        h2 { color: #6366f1; font-size: 1.2rem; margin-top: 0; }
        label { font-size: 0.8rem; color: #94a3b8; }
    </style>
</head>
<body>
    <h2>WorthMyTime</h2>
    <label>Salário Líquido (R$)</label>
    <input type="number" id="salary">
    
    <label>Horas Semanais</label>
    <input type="number" id="hoursWeek">

    <label>Preço do Produto (R$)</label>
    <input type="number" id="productPrice">

    <div id="resultArea" class="result">
        <div id="timeText" style="font-weight: bold; font-size: 1.2rem;"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
