<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #10b981;
            --border: #e5e7eb;
        }

        body { 
            width: 350px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 15px; 
            background: var(--bg); 
            color: var(--text-main);
            margin: 0;
            box-sizing: border-box;
        }

        h2 { 
            color: var(--primary); 
            font-size: 1.4rem; 
            margin: 0 0 15px 0; 
            text-align: center;
            font-weight: 800;
        }

        .input-group { margin-bottom: 12px; }

        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .col { flex: 1; }

        label { 
            display: block;
            font-size: 0.8rem; 
            color: var(--text-muted); 
            margin-bottom: 4px;
            font-weight: 600;
        }

        input, select { 
            width: 100%; 
            padding: 8px; 
            border-radius: 6px; 
            border: 1px solid var(--border); 
            background: #f9fafb; 
            color: var(--text-main); 
            box-sizing: border-box; 
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
            background: #ffffff;
        }

        input:disabled {
            background: #e5e7eb;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .result { 
            margin-top: 15px;
            background: #ecfdf5; 
            padding: 12px; 
            border-radius: 8px; 
            text-align: center; 
            display: none; 
            border: 1px solid #a7f3d0;
        }

        #timeText { 
            font-weight: 800; 
            font-size: 1.4rem; 
            color: #047857; 
        }
        
        .sub-text {
            font-size: 0.8rem;
            color: #065f46;
            margin-top: 2px;
            display: block;
        }
    </style>
</head>
<body>
    <h2>WorthMyTime</h2>
    
    <div class="row">
        <div class="col" style="flex: 1;">
            <label>Moeda</label>
            <select id="currency">
                <option value="R$">BRL</option>
                <option value="$">USD</option>
                <option value="€">EUR</option>
            </select>
        </div>
        <div class="col" style="flex: 1.5;">
            <label>Exibir nas lojas em</label>
            <select id="timeFormat">
                <option value="auto">Auto</option>
                <option value="minutes">Minutos</option>
                <option value="hours">Horas</option>
                <option value="days">Dias</option>
            </select>
        </div>
    </div>

    <div class="input-group">
        <label id="labelSalary">Salário Líquido (R$)</label>
        <input type="number" id="salary" placeholder="Ex: 3500">
    </div>

    <div class="row">
        <div class="col" style="flex: 1.5;">
            <label>Escala</label>
            <select id="workScale">
                <option value="5x2">5x2</option>
                <option value="6x1">6x1</option>
                <option value="12x36">12x36</option>
                <option value="custom">Outra</option>
            </select>
        </div>
        <div class="col" style="flex: 1;">
            <label id="labelTimeInput">Hrs/dia</label>
            <input type="number" id="timeInput" placeholder="8">
        </div>
    </div>

    <div class="input-group">
        <label id="labelPrice">Teste um Preço (R$)</label>
        <input type="number" id="productPrice" placeholder="Ex: 1200">
    </div>

    <div id="resultArea" class="result">
        <div id="timeText"></div>
        <span class="sub-text" id="days-info">do seu tempo</span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
