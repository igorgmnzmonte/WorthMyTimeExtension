<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --primary: #10b981; /* Verde Esmeralda */
            --border: #e5e7eb;
        }

        body { 
            width: 320px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 20px; 
            background: var(--bg); 
            color: var(--text-main);
            margin: 0;
        }

        h2 { 
            color: var(--primary); 
            font-size: 1.4rem; 
            margin: 0 0 20px 0; 
            text-align: center;
            font-weight: 800;
        }

        .input-group { margin-bottom: 15px; }

        label { 
            display: block;
            font-size: 0.85rem; 
            color: var(--text-muted); 
            margin-bottom: 5px;
            font-weight: 500;
        }

        input { 
            width: 100%; 
            padding: 10px; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            background: #f9fafb; 
            color: var(--text-main); 
            box-sizing: border-box; 
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            ring: 2px solid #a7f3d0;
        }

        .result { 
            margin-top: 20px;
            background: #ecfdf5; /* Verde bem claro */
            padding: 15px; 
            border-radius: 12px; 
            text-align: center; 
            display: none; 
            border: 1px solid #a7f3d0;
        }

        #timeText { 
            font-weight: bold; 
            font-size: 1.4rem; 
            color: #047857; /* Verde escuro para contraste */
        }
        
        .sub-text {
            font-size: 0.8rem;
            color: #065f46;
            margin-top: 4px;
            display: block;
        }
    </style>
</head>
<body>
    <h2>WorthMyTime</h2>
    
    <div class="input-group">
        <label>Seu Salário Líquido Mensal (R$)</label>
        <input type="number" id="salary" placeholder="Ex: 3500">
    </div>
    
    <div class="input-group">
        <label>Horas de Trabalho por Semana</label>
        <input type="number" id="hoursWeek" placeholder="Ex: 44">
    </div>

    <div class="input-group">
        <label>Preço do Produto (R$)</label>
        <input type="number" id="productPrice" placeholder="Ex: 1200">
    </div>

    <div id="resultArea" class="result">
        <div id="timeText"></div>
        <span class="sub-text">do seu tempo de vida</span>
    </div>

    <script src="popup.js"></script>
</body>
</html>
